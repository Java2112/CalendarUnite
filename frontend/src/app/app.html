<app-navbar (openLogin)="openLoginModal()"></app-navbar>

<main class="main-content">
  <app-calendar (selectEvent)="onSelectEvent($event)"></app-calendar>
</main>

<footer class="app-footer">
  <div class="footer-container">
    <div class="footer-brand">
      <strong>CalendarUnite</strong> • Plataforma de Actividades de Bienestar Universitario
    </div>
    <div class="footer-links">
      <span>APPS MOVILES HIBRIDAS</span>
    </div>
  </div>
</footer>

@if (selectedEvent) {
  <app-event-detail 
    [event]="selectedEvent" 
    (close)="closeEventModal()">
  </app-event-detail>
}

@if (authService.isAuthModalOpen()) {
  <app-login (close)="closeLoginModal()"></app-login>
}
