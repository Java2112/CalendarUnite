<app-navbar 
  [currentView]="activeView"
  (viewChange)="onViewChange($event)"
  (openLogin)="openLoginModal()">
</app-navbar>

<main class="main-content">
  @if (activeView === 'calendar') {
    <app-calendar (selectEvent)="onSelectEvent($event)"></app-calendar>
  } @else if (activeView === 'management') {
    <app-unified-management></app-unified-management>
  }
</main>

<footer class="app-footer">
  <div class="footer-container">
    <div class="footer-brand">
      <strong>CalendarUnite</strong> • Plataforma Institucional de Bienestar Universitario
    </div>
    <div class="footer-links">
      <span>APPS MÓVILES HÍBRIDAS • CALENDARIO Y BIENESTAR</span>
    </div>
  </div>
</footer>

@if (selectedEvent) {
  <app-event-detail 
    [event]="selectedEvent" 
    (close)="closeEventModal()">
  </app-event-detail>
}

@if (authService.isAuthModalOpen()) {
  <app-login (close)="closeLoginModal()"></app-login>
}
